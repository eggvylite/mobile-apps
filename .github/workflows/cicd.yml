name: Mobile CI/CD - v6 TestFlight & S3

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app should be built?"
        required: true
        type: choice
        options:
          - all
          - roja
          - paiio
          - jackpot
        default: all
      platform:
        description: "Which platform should be built?"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      version_name:
        description: "App Version (example: 1.9). Leave blank to keep project version."
        required: false
        type: string
      upload_testflight:
        description: "Upload to TestFlight?"
        required: false
        type: boolean
        default: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    name: Select Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - name: Generate App Matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          case "$APP" in
            all|"") echo 'apps=["roja","paiio","jackpot"]' >> "$GITHUB_OUTPUT" ;;
            roja|paiio|jackpot) echo "apps=[\"$APP\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "ERROR: Invalid app: $APP"; exit 1 ;;
          esac

  build-ios:
    name: iOS - ${{ matrix.app }}
    needs: setup
    if: >
      inputs.platform == 'all' ||
      inputs.platform == 'ios'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    env:
      APP_NAME: ${{ matrix.app }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Resolve App Directory
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$(find apps -maxdepth 1 -mindepth 1 -type d -iname "${{ matrix.app }}" -print -quit | sed 's|^apps/||')"
          if [ -z "$APP_DIR" ]; then echo "ERROR: Could not find apps/${{ matrix.app }}"; exit 1; fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-mobile-${{ github.run_id }}-${{ matrix.app }}

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Get App Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            APP_SECRETS,app/${{ matrix.app }}/cred
          parse-json-secrets: true

      - name: Validate iOS Configuration
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(
            APP_SECRETS_IOS_BUNDLE_ID
            APP_SECRETS_IOS_TEAM_ID
            APP_SECRETS_IOS_DISTRIBUTION_P12_BASE64
            APP_SECRETS_IOS_DISTRIBUTION_P12_PASSWORD
            APP_SECRETS_IOS_APPSTORE_ISSUER_ID
            APP_SECRETS_IOS_APPSTORE_API_KEY_ID
            APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY
          )
          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then echo "ERROR: Missing required iOS variable: $var"; exit 1; fi
          done
          if [ -z "${S3_BUCKET:-}" ]; then echo "ERROR: S3_BUCKET is empty."; exit 1; fi

      # CHANGE 1: Update to Node 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/${{ env.APP_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/${{ env.APP_DIR }}

      # ========================================================
      # PATCH IOS DEPENDENCIES & INSTALL PODS
      # ========================================================
      - name: Patch iOS Dependencies & Install Pods
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. Fix Boost URL
          python3 <<'PY'
          import glob
          old_url = "https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2"
          new_url = "https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2"
          for path in glob.glob("node_modules/**/boost*.podspec", recursive=True):
              with open(path, "r", encoding="utf-8") as f: content = f.read()
              if old_url in content:
                  content = content.replace(old_url, new_url)
                  with open(path, "w", encoding="utf-8") as f: f.write(content)
                  print(f"Patched Boost: {path}")
          
          for path in glob.glob("node_modules/**/RCT-Folly.podspec", recursive=True):
              with open(path, "r", encoding="utf-8") as f: content = f.read()
              if "-Wno-error=unqualified-std-cast-call" not in content:
                  content = content.replace("folly_compiler_flags = [", 'folly_compiler_flags = ["-Wno-error=unqualified-std-cast-call", "-Wno-error=c++11-narrowing", "-DFOLLY_NO_CONFIG=1", ', 1)
                  with open(path, "w", encoding="utf-8") as f: f.write(content)
                  print(f"Patched RCT-Folly: {path}")
          PY

          # 2. Clean Pods Cache
          cd ios
          bundle exec pod cache clean boost --all || true
          bundle exec pod cache clean RCT-Folly --all || true
          
          # 3. Install Pods
          bundle exec pod install --repo-update

      # ========================================================
      # PRE-FLIGHT CHECK: VERIFY ALL PACKAGES & PATCHES
      # THIS RUNS BEFORE BUILD TO SAVE TIME
      # ========================================================
      - name: Pre-Flight Build Verification
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Starting Pre-Flight Verification..."
          ERRORS=0

          # 1. Check Critical Node Modules
          for DEP in react-native-reanimated react-native-gesture-handler date-fns @react-native-picker/picker react-native-pager-view; do
            if [ ! -d "node_modules/$DEP" ]; then
              echo "❌ MISSING NODE MODULE: $DEP"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # 2. Check iOS Pods Directory
          if [ ! -d "ios/Pods" ]; then
            echo "❌ MISSING: ios/Pods directory"
            ERRORS=$((ERRORS + 1))
          fi

          # 3. Check Files We Intend to Patch
          FILES_TO_CHECK=(
            "node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
            "ios/Pods/fmt/include/fmt/base.h"
            "ios/Pods/fmt/include/fmt/format-inl.h"
          )

          for FILE in "${FILES_TO_CHECK[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ MISSING FILE: $FILE"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS critical prerequisites missing. Aborting before build."
            exit 1
          fi
          echo "✅ All pre-flight checks passed. Ready to build."

      # ========================================================
      # APPLY ALL SOURCE CODE PATCHES
      # ========================================================
      - name: Patch Reanimated for Xcode 16
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          REANIMATED_FILE=$(find node_modules/react-native-reanimated -name "ReanimatedVersion.cpp" -type f 2>/dev/null | head -n 1)
          if [ -z "$REANIMATED_FILE" ]; then
            echo "⚠️ ReanimatedVersion.cpp not found. Skipping."
            exit 0
          fi
          echo "✅ Found: $REANIMATED_FILE"
          TEMP_FILE=$(mktemp)
          echo '#ifndef REANIMATED_VERSION_STRING' > "$TEMP_FILE"
          echo '#define REANIMATED_VERSION_STRING "3.19.5"' >> "$TEMP_FILE"
          echo '#endif' >> "$TEMP_FILE"
          cat "$REANIMATED_FILE" >> "$TEMP_FILE"
          mv "$TEMP_FILE" "$REANIMATED_FILE"
          echo "✅ ReanimatedVersion.cpp patched."

      - name: Patch HermesExecutorFactory.cpp
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          HERMES_FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$HERMES_FILE" ] && ! grep -q "#include <thread>" "$HERMES_FILE"; then
            echo "🔧 Adding #include <thread>..."
            python3 << 'PYEOF'
          path = "node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          with open(path, "r") as f:
              lines = f.readlines()
          insert_at = 0
          for i, line in enumerate(lines):
              if line.startswith("#include "):
                  insert_at = i
                  break
          lines.insert(insert_at, "#include <thread>\n")
          with open(path, "w") as f:
              f.writelines(lines)
          print("✅ HermesExecutorFactory.cpp patched.")
          PYEOF
          else
            echo "ℹ️ HermesExecutorFactory.cpp already has #include <thread> or not found."
          fi

      # ========================================================
      # PERMANENT FIX FOR FMT LIBRARY (XCODE 26)
      # PYTHON-BASED SOURCE PATCHING WITH PERMISSION FIX
      # ========================================================
      - name: Patch fmt for Xcode 26 (Permanent Fix)
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail
          echo "🔧 Applying permanent Python-based patch to fmt library..."
          
          python3 << 'PYEOF'
          import os
          import re

          fmt_dir = "Pods/fmt"
          
          # Regex to match FMT_STRING("...") and replace with "..."
          pattern = re.compile(r'FMT_STRING\(\s*("[^"]*")\s*\)')
          
          for root, dirs, files in os.walk(fmt_dir):
              for file in files:
                  if file.endswith(('.h', '.cc', '.cpp')):
                      filepath = os.path.join(root, file)
                      try:
                          # Make file writable before modifying
                          os.chmod(filepath, 0o644)
                          
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          new_content = pattern.sub(r'\1', content)
                          
                          if new_content != content:
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                              print(f"✅ Patched: {filepath}")
                      except Exception as e:
                          print(f"⚠️ Error processing {filepath}: {e}")
          
          # Also disable consteval in base.h as backup
          base_h = os.path.join(fmt_dir, "include/fmt/base.h")
          if os.path.exists(base_h):
              os.chmod(base_h, 0o644)
              with open(base_h, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              if "#define FMT_USE_CONSTEVAL 0" not in content:
                  content = "#define FMT_USE_CONSTEVAL 0\n#define FMT_USE_CONSTEXPR 0\n" + content
                  with open(base_h, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print("✅ Disabled consteval/constexpr in base.h")
          PYEOF

          # Add compiler flags as a final backup
          gem install xcodeproj --no-document > /dev/null 2>&1 || true
          
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'Pods/Pods.xcodeproj'
          
          if File.exist?(project_path)
            project = Xcodeproj::Project.open(project_path)
            
            project.targets.each do |target|
              if target.name.include?('fmt')
                target.build_configurations.each do |config|
                  cxx_flags = config.build_settings['OTHER_CPLUSPLUSFLAGS'] || []
                  cxx_flags = [cxx_flags] unless cxx_flags.is_a?(Array)
                  
                  ['-DFMT_USE_CONSTEVAL=0', '-DFMT_USE_CONSTEXPR=0'].each do |flag|
                    unless cxx_flags.any? { |f| f.include?(flag) }
                      cxx_flags << flag
                    end
                  end
                  
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = cxx_flags
                end
              end
            end
            
            project.save
            puts "✅ Saved Pods.xcodeproj with fmt compiler flags"
          end
          RUBY
          
          echo "✅ fmt library patched successfully"

      - name: Fix ReanimatedMountHook HighResTimeStamp
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fix_mount_hook.py << 'ENDSCRIPT'
          import re, sys, os
          path = sys.argv[1]
          real_path = os.path.realpath(path)
          with open(real_path, 'r') as f:
              content = f.read()
          original = content
          content = re.sub(r'#\s*if\s+REACT_NATIVE_MINOR_VERSION\s*>=\s*81\s*\n(.*?)#\s*else\s*\n.*?#\s*endif', r'\1', content, flags=re.DOTALL)
          content = re.sub(r'^\s*//\s*REACT_NATIVE_MINOR_VERSION.*$', '', content, flags=re.MULTILINE)
          content = content.replace('double /*unmountTime*/', 'HighResTimeStamp /*unmountTime*/')
          content = content.replace('double commitTime', 'HighResTimeStamp commitTime')
          content = content.replace('double startTime', 'HighResTimeStamp startTime')
          if content != original:
              with open(real_path, 'w') as f:
                  f.write(content)
              print(f'✅ Fixed: {real_path}')
          else:
              print(f'ℹ️ No changes needed: {real_path}')
          ENDSCRIPT
          
          echo "🔍 Finding all ReanimatedMountHook files..."
          FOUND=0
          while IFS= read -r FILE; do
              FOUND=1
              python3 /tmp/fix_mount_hook.py "$FILE"
          done < <(find ios/Pods node_modules/react-native-reanimated -name "ReanimatedMountHook.h" 2>/dev/null)
          
          while IFS= read -r FILE; do
              FOUND=1
              python3 /tmp/fix_mount_hook.py "$FILE"
          done < <(find ios/Pods node_modules/react-native-reanimated -name "ReanimatedMountHook.cpp" 2>/dev/null)
          
          if [ "$FOUND" -eq 0 ]; then
              echo "⚠️ No ReanimatedMountHook files found to patch."
          fi

      - name: Patch RNGestureHandler for RN 0.81
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          GH_MODULE="node_modules/react-native-gesture-handler/apple/RNGestureHandlerModule.mm"
          if [ -f "$GH_MODULE" ]; then
            echo "🔧 Patching RNGestureHandlerModule.mm for RN 0.81..."
            python3 << 'PYEOF'
          path = "node_modules/react-native-gesture-handler/apple/RNGestureHandlerModule.mm"
          with open(path, "r") as f:
              content = f.read()
          original = content
          content = content.replace(
              "auto shadowNode = shadowNodeFromValue(runtime, arguments[0]);",
              "auto shadowNodeList = shadowNodeListFromValue(runtime, arguments[0]);\n  auto shadowNode = (shadowNodeList && !shadowNodeList->empty()) ? (*shadowNodeList)[0] : nullptr;"
          )
          if content != original:
              with open(path, "w") as f:
                  f.write(content)
              print("✅ RNGestureHandlerModule.mm patched.")
          else:
              print("ℹ️ No changes needed.")
          PYEOF
          else
            echo "⚠️ RNGestureHandlerModule.mm not found."
          fi

      - name: Fix Pod Resource Bundle Signing
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document > /dev/null 2>&1 || true
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'Pods/Pods.xcodeproj'
          if File.exist?(project_path)
            project = Xcodeproj::Project.open(project_path)
            project.targets.each do |target|
              next unless target.respond_to?(:product_type)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                config.build_settings['PROVISIONING_PROFILE'] = ''
              end
            end
            project.save
            puts "✅ Disabled code signing for all non-app targets."
          end
          RUBY

      - name: Import Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.APP_SECRETS_IOS_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ env.APP_SECRETS_IOS_DISTRIBUTION_P12_PASSWORD }}

      - name: Prepare App Store Connect API Key
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}.p8"
          if printf '%s' "$APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY" | grep -q -- 'BEGIN PRIVATE KEY'; then
            printf '%s' "$APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          else
            printf '%s' "$APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY" | tr -d '\r' | base64 --decode > "$API_KEY_PATH"
          fi
          chmod 600 "$API_KEY_PATH"
          echo "XCODE_AUTH_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve Xcode Workspace and Scheme
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_PATH="$(find ios -maxdepth 1 -name "*.xcworkspace" -type d -print -quit)"
          if [ -z "$WORKSPACE_PATH" ]; then echo "ERROR: No .xcworkspace found."; exit 1; fi
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          echo "WORKSPACE_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"
          echo "SCHEME_NAME=$SCHEME_NAME" >> "$GITHUB_ENV"

      - name: Configure Distribution Signing
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = Dir.glob('ios/*.xcodeproj').first
          abort('ERROR: No .xcodeproj found inside ios/.') unless project_path
          project = Xcodeproj::Project.open(project_path)
          application_targets = project.targets.select { |t| t.respond_to?(:product_type) && t.product_type == 'com.apple.product-type.application' }
          target = application_targets.find { |t| t.name == ENV['SCHEME_NAME'] } || application_targets.first
          abort('ERROR: Could not resolve the iOS application target.') unless target
          attrs = project.root_object.attributes['TargetAttributes'] ||= {}
          target_attrs = attrs[target.uuid] ||= {}
          target_attrs['ProvisioningStyle'] = 'Manual'
          
          profile_uuid = "b0ff62c4-5f8a-4708-9a33-64ff3638d355"
          
          target.build_configurations.each do |config|
            config.build_settings['PROVISIONING_PROFILE'] = profile_uuid
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = "DemoROJA"
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APP_SECRETS_IOS_TEAM_ID')
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          end
          project.save
          puts "✅ Injected Provisioning Profile UUID: #{profile_uuid}"
          RUBY

      # ========================================================
      # CLEAN DERIVED DATA BEFORE BUILD (CRITICAL)
      # ========================================================
      - name: Clean Derived Data
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🧹 Cleaning Derived Data to ensure fresh build..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/DemoROJA-*
          echo "✅ Derived Data cleaned."

      - name: Build and Archive for TestFlight
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/ios/build/${APP_NAME}.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${APP_SECRETS_IOS_TEAM_ID}" \
            PROVISIONING_PROFILE="b0ff62c4-5f8a-4708-9a33-64ff3638d355" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${XCODE_AUTH_KEY_PATH}" \
            -authenticationKeyID "${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_SECRETS_IOS_APPSTORE_ISSUER_ID}" \
            archive

      - name: Export IPA for App Store
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/build/export && mkdir -p ios/build/export
          cat > ios/build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APP_SECRETS_IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_SECRETS_IOS_BUNDLE_ID}</key>
              <string>b0ff62c4-5f8a-4708-9a33-64ff3638d355</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ios/build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$PWD/ios/build/${APP_NAME}.xcarchive" \
            -exportPath "$PWD/ios/build/export" \
            -exportOptionsPlist "$PWD/ios/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${XCODE_AUTH_KEY_PATH}" \
            -authenticationKeyID "${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_SECRETS_IOS_APPSTORE_ISSUER_ID}"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-${{ github.run_number }}
          path: apps/${{ env.APP_DIR }}/ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Current iOS IPA to S3
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_FILE=$(find ios/build/export -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ ERROR: No .ipa file found in ios/build/export/"
            exit 1
          fi
          echo "📦 Found IPA: $IPA_FILE"
          aws s3 cp "$IPA_FILE" "s3://${S3_BUCKET}/ios/${APP_NAME}/${APP_NAME}.ipa" --only-show-errors
          echo "✅ Successfully uploaded to S3"

      - name: Clean Pod Cache
        if: always()
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          echo "🧹 Cleaning pod cache..."
          bundle exec pod cache clean --all || true
          echo "✅ Pod cache cleaned."
