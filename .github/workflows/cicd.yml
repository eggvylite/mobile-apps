name: Mobile CI/CD

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app should be built?"
        required: true
        type: choice
        options:
          - all
          - roja
          - paiio
          - jackpot
        default: all

      platform:
        description: "Which platform should be built?"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all

      version_name:
        description: "App Version (example: 1.9). Leave blank to keep project version."
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

# GitHub OIDC -> AWS
permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # SELECT APPS
  # ============================================================
  setup:
    name: Select Apps
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.matrix.outputs.apps }}

    steps:
      - name: Generate App Matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ inputs.app }}"

          case "$APP" in
            all|"")
              echo 'apps=["roja","paiio","jackpot"]' >> "$GITHUB_OUTPUT"
              ;;

            roja|paiio|jackpot)
              echo "apps=[\"$APP\"]" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "ERROR: Invalid app: $APP"
              exit 1
              ;;
          esac


  # ============================================================
  # IOS
  # ============================================================
  build-ios:
    name: iOS - ${{ matrix.app }}

    needs: setup

    if: >
      inputs.platform == 'all' ||
      inputs.platform == 'ios'

    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}

    env:
      APP_NAME: ${{ matrix.app }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      # ========================================================
      # RESOLVE APP DIRECTORY
      # ========================================================
      - name: Resolve App Directory
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(
            find apps \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -iname "${{ matrix.app }}" \
              -print -quit \
            | sed 's|^apps/||'
          )"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not find apps/${{ matrix.app }}"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Resolved:"
          echo "apps/$APP_DIR"


      # ========================================================
      # AWS OIDC
      # ========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-mobile-${{ github.run_id }}-${{ matrix.app }}


      # ========================================================
      # VERIFY AWS
      # ========================================================
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "ERROR: S3_BUCKET is empty."
            exit 1
          fi


      # ========================================================
      # LOAD APP SECRETS
      # ========================================================
      - name: Get App Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            APP_SECRETS,app/${{ matrix.app }}/cred
          parse-json-secrets: true


      # ========================================================
      # VALIDATE IOS SECRETS
      # ========================================================
      - name: Validate iOS Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            APP_SECRETS_IOS_BUNDLE_ID
            APP_SECRETS_IOS_TEAM_ID
            APP_SECRETS_IOS_P12_BASE64
            APP_SECRETS_IOS_P12_PASSWORD
            APP_SECRETS_IOS_APPSTORE_ISSUER_ID
            APP_SECRETS_IOS_APPSTORE_API_KEY_ID
            APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Missing required iOS variable: $var"
              exit 1
            fi
          done

          echo "iOS configuration:"
          echo "Bundle ID : $APP_SECRETS_IOS_BUNDLE_ID"
          echo "Team ID   : $APP_SECRETS_IOS_TEAM_ID"


      # ========================================================
      # NODE
      # ========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/${{ env.APP_DIR }}/package-lock.json


      # ========================================================
      # NPM
      # ========================================================
      - name: Install Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm ci --legacy-peer-deps


      # ========================================================
      # RUBY
      # ========================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/${{ env.APP_DIR }}


      # ========================================================
      # PATCH IOS DEPENDENCIES
      # ========================================================
      - name: Patch iOS Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import glob

          # ----------------------------------------------------
          # Boost
          # ----------------------------------------------------
          old_url = (
              "https://boostorg.jfrog.io/artifactory/main/"
              "release/1.76.0/source/boost_1_76_0.tar.bz2"
          )

          new_url = (
              "https://archives.boost.io/release/1.76.0/"
              "source/boost_1_76_0.tar.bz2"
          )

          for path in glob.glob(
              "node_modules/**/boost*.podspec",
              recursive=True
          ):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if old_url in content:
                  content = content.replace(old_url, new_url)

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(f"Patched Boost: {path}")


          # ----------------------------------------------------
          # RCT-Folly
          # ----------------------------------------------------
          for path in glob.glob(
              "node_modules/**/RCT-Folly.podspec",
              recursive=True
          ):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "-Wno-error=unqualified-std-cast-call" not in content:
                  content = content.replace(
                      "folly_compiler_flags = [",
                      (
                          'folly_compiler_flags = ['
                          '"-Wno-error=unqualified-std-cast-call", '
                          '"-Wno-error=c++11-narrowing", '
                          '"-DFOLLY_NO_CONFIG=1", '
                      ),
                      1
                  )

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(f"Patched RCT-Folly: {path}")
          PY


     # ========================================================
      # PODFILE
      # ========================================================
      - name: Configure Pod Build Settings
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          path = Path("ios/Podfile")
          
          if not path.exists():
              raise SystemExit("ERROR: ios/Podfile not found")
          
          content = path.read_text()
          marker = "post_install do |installer|"
          
          if marker not in content:
              raise SystemExit(
                  "ERROR: Could not find expected CocoaPods post_install marker."
              )
          
          settings = '''
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
                config.build_settings["CLANG_CXX_LANGUAGE_STANDARD"] = "c++17"
                config.build_settings["GCC_WARN_INHIBIT_ALL_WARNINGS"] = "YES"
                config.build_settings["GCC_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                
                # Explicitly disable code signing for all Pods to prevent archive crashes
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              end
            end
          '''
          
          # Inject the settings if they aren't already present
          if 'CODE_SIGNING_ALLOWED"] = "NO"' not in content:
              content = content.replace(
                  marker,
                  marker + "\n" + settings,
                  1
              )
              path.write_text(content)
              print("Podfile patched successfully with CODE_SIGNING_ALLOWED=NO.")
          else:
              print("Podfile already patched.")
          PY
      # ========================================================
      # COCOAPODS
      # ========================================================
      - name: Install CocoaPods
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail

          bundle exec pod cache clean boost --all || true
          bundle exec pod cache clean RCT-Folly --all || true

          bundle exec pod install --repo-update


      # ========================================================
      # APPLE DEVELOPMENT CERTIFICATE
      #
      # This matches the working Xcode configuration shown in the
      # screenshots: Apple Development + Automatically manage signing.
      # ========================================================
      - name: Import Apple Development Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.APP_SECRETS_IOS_P12_BASE64 }}
          p12-password: ${{ env.APP_SECRETS_IOS_P12_PASSWORD }}


      # ========================================================
      # VERIFY DEVELOPMENT CERTIFICATE
      # ========================================================
      - name: Verify Apple Development Certificate
        shell: bash
        run: |
          set -euo pipefail

          echo "Available code signing identities:"
          security find-identity -v -p codesigning || true

          if ! security find-identity -v -p codesigning | grep -q "Apple Development"; then
            echo "ERROR: Apple Development certificate was not found."
            exit 1
          fi

          echo "Apple Development certificate successfully verified."


      # ========================================================
      # APP STORE CONNECT API KEY FOR XCODE AUTOMATIC SIGNING
      # ========================================================
      - name: Prepare App Store Connect API Key for Xcode
        shell: bash
        run: |
          set -euo pipefail

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}.p8"

          echo "${APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY}" \
            | tr -d '\r' \
            | base64 --decode \
            > "$API_KEY_PATH"

          chmod 600 "$API_KEY_PATH"

          if [ ! -s "$API_KEY_PATH" ]; then
            echo "ERROR: App Store Connect API key file is empty."
            exit 1
          fi

          echo "XCODE_AUTH_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

          echo "Xcode App Store Connect API key prepared."


      # ========================================================
      # VERSION
      # ========================================================
      - name: Set iOS Version and Build Number
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail

          xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER"

          if [ -n "${{ inputs.version_name }}" ]; then
            xcrun agvtool new-marketing-version "${{ inputs.version_name }}"
          fi



      # ========================================================
      # RESOLVE WORKSPACE
      # ========================================================
      - name: Resolve Xcode Workspace and Scheme
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${APP_SECRETS_IOS_WORKSPACE:-}" ]; then
            WORKSPACE_PATH="$APP_SECRETS_IOS_WORKSPACE"
          else
            WORKSPACE_PATH="$(
              find ios \
                -maxdepth 1 \
                -name "*.xcworkspace" \
                -type d \
                -print -quit
            )"
          fi

          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERROR: No .xcworkspace found."
            exit 1
          fi

          if [ -n "${APP_SECRETS_IOS_SCHEME:-}" ]; then
            SCHEME_NAME="$APP_SECRETS_IOS_SCHEME"
          else
            # Extract the exact base name of the workspace to use as the scheme
            # This permanently avoids accidentally selecting CocoaPods dependencies.
            SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          fi

          echo "WORKSPACE_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"
          echo "SCHEME_NAME=$SCHEME_NAME" >> "$GITHUB_ENV"

          echo "Workspace: $WORKSPACE_PATH"
          echo "Scheme: $SCHEME_NAME"

      # ========================================================
      # ARCHIVE PREPARATION
      # ========================================================
      - name: Prepare iOS Archive
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ios/build
          mkdir -p ios/build

          echo "Using Xcode automatic signing from the project settings."
          echo "Development Team: ${APP_SECRETS_IOS_TEAM_ID}"
          echo "Bundle ID: ${APP_SECRETS_IOS_BUNDLE_ID}"


      # ========================================================
      # VERIFY XCODE AUTOMATIC SIGNING
      #
      # Do NOT inject PROVISIONING_PROFILE or manual signing values.
      # The checked-in project is configured with:
      #   Automatically manage signing = ON
      #   Apple Development certificate
      # ========================================================
      - name: Verify Xcode Automatic Signing Configuration
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = Dir.glob('ios/*.xcodeproj').first

          unless project_path
            abort('ERROR: No .xcodeproj found inside ios/.')
          end

          project = Xcodeproj::Project.open(project_path)
          attributes = project.root_object.attributes['TargetAttributes'] || {}

          app_targets = project.targets.reject do |target|
            target.name.include?('Test') || target.name.include?('Tests')
          end

          if app_targets.empty?
            abort('ERROR: No application target was found.')
          end

          app_targets.each do |target|
            target_attributes = attributes[target.uuid] || {}
            provisioning_style = target_attributes['ProvisioningStyle']

            puts "Target: #{target.name}"
            puts "ProvisioningStyle: #{provisioning_style || 'not explicitly set'}"

            if provisioning_style && provisioning_style != 'Automatic'
              abort("ERROR: Target #{target.name} is configured for #{provisioning_style} signing. Expected Automatic.")
            end

            target.build_configurations.each do |config|
              style = config.build_settings['CODE_SIGN_STYLE']
              identity = config.build_settings['CODE_SIGN_IDENTITY']

              puts "  #{config.name}: CODE_SIGN_STYLE=#{style || 'default'} CODE_SIGN_IDENTITY=#{identity || 'default'}"

              if style == 'Manual'
                abort("ERROR: #{target.name} / #{config.name} has CODE_SIGN_STYLE=Manual. Remove manual signing from the project.")
              end

              if config.build_settings['PROVISIONING_PROFILE'] || config.build_settings['PROVISIONING_PROFILE_SPECIFIER']
                abort("ERROR: #{target.name} / #{config.name} contains a manual provisioning profile setting. Automatic signing must manage the profile.")
              end
            end
          end

          puts 'Xcode project is compatible with automatic signing.'
          RUBY


      # ========================================================
      # SHOW FINAL XCODE SIGNING SETTINGS
      # ========================================================
      - name: Show Xcode Signing Settings
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "XCODE SIGNING SETTINGS"
          echo "================================================"

          xcodebuild \
            -workspace "${WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -showBuildSettings \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER' \
            || true


      # ========================================================
      # ARCHIVE
      #
      # Keep the archive developer-signed, matching Apple's Xcode
      # workflow. Automatic signing is allowed to obtain/update the
      # Xcode-managed provisioning profile.
      # ========================================================
      - name: Build and Archive
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Using resolved workspace: ${WORKSPACE_PATH}"
          echo "Using resolved scheme: ${SCHEME_NAME}"
          echo "Automatic signing: enabled"
          echo "Development team: ${APP_SECRETS_IOS_TEAM_ID}"

          xcodebuild \
            -workspace "${WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/ios/build/${APP_NAME}.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${XCODE_AUTH_KEY_PATH}" \
            -authenticationKeyID "${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_SECRETS_IOS_APPSTORE_ISSUER_ID}" \
            clean archive


      # ========================================================
      # VERIFY ARCHIVE
      # ========================================================
      - name: Verify iOS Archive
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$PWD/ios/build/${APP_NAME}.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive was not created: $ARCHIVE"
            exit 1
          fi

          echo "Archive created successfully:"
          echo "$ARCHIVE"


      # ========================================================
      # EXPORT OPTIONS
      #
      # Match Xcode Organizer's automatic TestFlight/App Store
      # distribution flow. Xcode handles distribution signing and
      # provisioning during export.
      # ========================================================
      - name: Create ExportOptions.plist
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat > ios/build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

            <key>destination</key>
            <string>export</string>

            <key>method</key>
            <string>app-store</string>

            <key>signingStyle</key>
            <string>automatic</string>

            <key>teamID</key>
            <string>${APP_SECRETS_IOS_TEAM_ID}</string>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>

          </dict>
          </plist>
          EOF

          plutil -lint ios/build/ExportOptions.plist

          echo "ExportOptions.plist created successfully."
          cat ios/build/ExportOptions.plist


      # ========================================================
      # EXPORT IPA
      # ========================================================
      - name: Export IPA
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ios/build/export
          mkdir -p ios/build/export

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/ios/build/${APP_NAME}.xcarchive" \
            -exportPath "$PWD/ios/build/export" \
            -exportOptionsPlist "$PWD/ios/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${XCODE_AUTH_KEY_PATH}" \
            -authenticationKeyID "${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_SECRETS_IOS_APPSTORE_ISSUER_ID}"


      # ========================================================
      # PREPARE IPA
      # ========================================================
      - name: Prepare IPA
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          IPA="$(
            find ios/build/export \
              -name "*.ipa" \
              -type f \
              -print -quit
          )"

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          OUTPUT="ios/build/${APP_NAME}-${GITHUB_RUN_NUMBER}.ipa"

          cp "$IPA" "$OUTPUT"

          echo "IPA ready:"
          echo "$OUTPUT"


      # ========================================================
      # GITHUB ARTIFACT
      # ========================================================
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-${{ github.run_number }}
          path: apps/${{ env.APP_DIR }}/ios/build/${{ matrix.app }}-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14


      # ========================================================
      # S3
      # ========================================================
      - name: Upload Current iOS IPA to S3
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            "ios/build/${APP_NAME}-${GITHUB_RUN_NUMBER}.ipa" \
            "s3://${S3_BUCKET}/ios/${APP_NAME}/${APP_NAME}.ipa" \
            --only-show-errors


      # ========================================================
      # TESTFLIGHT
      # ========================================================
      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v4
        with:
          app-path: apps/${{ env.APP_DIR }}/ios/build/${{ matrix.app }}-${{ github.run_number }}.ipa
          issuer-id: ${{ env.APP_SECRETS_IOS_APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APP_SECRETS_IOS_APPSTORE_API_KEY_ID }}
          api-private-key: ${{ env.APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY }}


  # ============================================================
  # ANDROID
  # ============================================================
  build-android:
    name: Android - ${{ matrix.app }}

    needs: setup

    if: >
      inputs.platform == 'all' ||
      inputs.platform == 'android'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}

    env:
      APP_NAME: ${{ matrix.app }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      # ========================================================
      # RESOLVE APP DIRECTORY
      # ========================================================
      - name: Resolve App Directory
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(
            find apps \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -iname "${{ matrix.app }}" \
              -print -quit \
            | sed 's|^apps/||'
          )"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not find apps/${{ matrix.app }}"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"


      # ========================================================
      # AWS OIDC
      # ========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-mobile-${{ github.run_id }}-${{ matrix.app }}


      # ========================================================
      # VERIFY AWS
      # ========================================================
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "ERROR: S3_BUCKET is empty."
            exit 1
          fi


      # ========================================================
      # LOAD APP SECRETS
      # ========================================================
      - name: Get App Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            APP_SECRETS,app/${{ matrix.app }}/cred
          parse-json-secrets: true


      # ========================================================
      # VALIDATE ANDROID
      # ========================================================
      - name: Validate Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            APP_SECRETS_ANDROID_KEYSTORE_BASE64
            APP_SECRETS_ANDROID_KEYSTORE_PASSWORD
            APP_SECRETS_ANDROID_KEY_ALIAS
            APP_SECRETS_ANDROID_KEY_PASSWORD
            APP_SECRETS_ANDROID_APPLICATION_ID
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Missing required Android variable: $var"
              exit 1
            fi
          done

          echo "Android configuration is present."
          echo "Application ID: $APP_SECRETS_ANDROID_APPLICATION_ID"


      # ========================================================
      # NODE
      # ========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ env.APP_DIR }}/package-lock.json


      # ========================================================
      # NPM
      # ========================================================
      - name: Install Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm ci --legacy-peer-deps


      # ========================================================
      # JAVA
      # ========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ========================================================
      # ANDROID KEYSTORE
      # ========================================================
      - name: Create Android Keystore
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          printf '%s' "$APP_SECRETS_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "ERROR: Android keystore is empty."
            exit 1
          fi


      # ========================================================
      # ANDROID SIGNING
      # ========================================================
      - name: Configure Android Signing
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=${APP_SECRETS_ANDROID_KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_ALIAS=${APP_SECRETS_ANDROID_KEY_ALIAS}
          MYAPP_UPLOAD_KEY_PASSWORD=${APP_SECRETS_ANDROID_KEY_PASSWORD}
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          EOF


      # ========================================================
      # ANDROID BUILD
      # ========================================================
      - name: Build Android AAB
        working-directory: apps/${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          VARIANT="${APP_SECRETS_ANDROID_VARIANT:-Release}"

          FIRST_CHAR="${VARIANT:0:1}"
          REST="${VARIANT:1}"

          FIRST_CHAR="$(echo "$FIRST_CHAR" | tr '[:lower:]' '[:upper:]')"

          GRADLE_TASK="${FIRST_CHAR}${REST}"

          echo "Gradle task: :app:bundle${GRADLE_TASK}"

          ./gradlew \
            ":app:bundle${GRADLE_TASK}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"


      # ========================================================
      # PREPARE AAB
      # ========================================================
      - name: Prepare AAB
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(
            find android/app/build/outputs/bundle \
              -name "*.aab" \
              -type f \
              -print -quit
          )"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          mkdir -p android/build

          OUTPUT="android/build/${APP_NAME}-${GITHUB_RUN_NUMBER}.aab"

          cp "$AAB" "$OUTPUT"

          echo "AAB ready:"
          echo "$OUTPUT"


      # ========================================================
      # GITHUB ARTIFACT
      # ========================================================
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-${{ github.run_number }}
          path: apps/${{ env.APP_DIR }}/android/build/${{ matrix.app }}-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 14


      # ========================================================
      # S3
      # ========================================================
      - name: Upload Current Android AAB to S3
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            "android/build/${APP_NAME}-${GITHUB_RUN_NUMBER}.aab" \
            "s3://${S3_BUCKET}/android/${APP_NAME}/${APP_NAME}.aab" \
            --only-show-errors


      # ========================================================
      # GOOGLE PLAY
      # ========================================================
      - name: Upload to Google Play
        if: env.APP_SECRETS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.APP_SECRETS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_SECRETS_ANDROID_APPLICATION_ID }}
          releaseFiles: apps/${{ env.APP_DIR }}/android/build/${{ matrix.app }}-${{ github.run_number }}.aab
          track: internal
