name: Mobile CI/CD - v6 Development Test

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app should be built?"
        required: true
        type: choice
        options:
          - all
          - roja
          - paiio
          - jackpot
        default: all

      platform:
        description: "Which platform should be built?"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all

      version_name:
        description: "App Version (example: 1.9). Leave blank to keep project version."
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

# GitHub OIDC -> AWS
permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # SELECT APPS
  # ============================================================
  setup:
    name: Select Apps
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.matrix.outputs.apps }}

    steps:
      - name: Generate App Matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ inputs.app }}"

          case "$APP" in
            all|"")
              echo 'apps=["roja","paiio","jackpot"]' >> "$GITHUB_OUTPUT"
              ;;

            roja|paiio|jackpot)
              echo "apps=[\"$APP\"]" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "ERROR: Invalid app: $APP"
              exit 1
              ;;
          esac


  # ============================================================
  # IOS
  # ============================================================
  build-ios:
    name: iOS - ${{ matrix.app }}

    needs: setup

    if: >
      inputs.platform == 'all' ||
      inputs.platform == 'ios'

    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}

    env:
      APP_NAME: ${{ matrix.app }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
               
    # ➕ ADD THIS STEP HERE TO FORCE XCODE 16.2
      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'


      # ========================================================
      # RESOLVE APP DIRECTORY
      # ========================================================
      - name: Resolve App Directory
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(
            find apps \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -iname "${{ matrix.app }}" \
              -print -quit \
            | sed 's|^apps/||'
          )"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not find apps/${{ matrix.app }}"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Resolved:"
          echo "apps/$APP_DIR"


      # ========================================================
      # AWS OIDC
      # ========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-mobile-${{ github.run_id }}-${{ matrix.app }}


      # ========================================================
      # VERIFY AWS
      # ========================================================
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "ERROR: S3_BUCKET is empty."
            exit 1
          fi


      # ========================================================
      # LOAD APP SECRETS
      # ========================================================
      - name: Get App Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            APP_SECRETS,app/${{ matrix.app }}/cred
          parse-json-secrets: true


      # ========================================================
      # VALIDATE IOS SECRETS
      # ========================================================
      - name: Validate iOS Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            APP_SECRETS_IOS_BUNDLE_ID
            APP_SECRETS_IOS_TEAM_ID
            APP_SECRETS_IOS_P12_BASE64
            APP_SECRETS_IOS_P12_PASSWORD
            APP_SECRETS_IOS_APPSTORE_ISSUER_ID
            APP_SECRETS_IOS_APPSTORE_API_KEY_ID
            APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Missing required iOS variable: $var"
              exit 1
            fi
          done

          echo "iOS configuration:"
          echo "Bundle ID : $APP_SECRETS_IOS_BUNDLE_ID"
          echo "Team ID   : $APP_SECRETS_IOS_TEAM_ID"


      # ========================================================
      # NODE
      # ========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ env.APP_DIR }}/package-lock.json


      # ========================================================
      # NPM
      # ========================================================
      - name: Install Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm ci --legacy-peer-deps


      # ========================================================
      # APPLY C++ COMPATIBILITY PATCHES (DYNAMIC SEARCH)
      # ========================================================
      - name: Apply C++ Compatibility Patches
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          # 1. HermesExecutorFactory.cpp patch
          HERMES_EXECUTOR_FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"

          if [ ! -f "$HERMES_EXECUTOR_FILE" ]; then
            echo "ERROR: HermesExecutorFactory.cpp not found: $HERMES_EXECUTOR_FILE"
            exit 1
          fi

          python3 - "$HERMES_EXECUTOR_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "#include <thread>" not in content:
              lines = content.splitlines(True)
              insert_at = 0

              for i, line in enumerate(lines):
                  if line.startswith("#include "):
                      insert_at = i
                      break

              if insert_at == 0 and not any(line.startswith("#include ") for line in lines):
                  raise SystemExit("ERROR: No C++ include section found.")

              lines.insert(insert_at, "#include <thread>\n")
              content = "".join(lines)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("HermesExecutorFactory.cpp: <thread> present")
          PY

          # 2. PerformanceObserver.cpp patch
          PERF_OBSERVER_FILE="node_modules/react-native/ReactCommon/react/performance/timeline/PerformanceObserver.cpp"

          if [ -f "$PERF_OBSERVER_FILE" ]; then
            sed -i.bak 's/observedTypes_\.contains(entryType)/observedTypes_.find(entryType) != observedTypes_.end()/g' "$PERF_OBSERVER_FILE"
            echo "PerformanceObserver.cpp compatibility patch applied."
          fi

          # 3. ReanimatedVersion.cpp patch (Xcode 16 C++20 compatibility)
          # DYNAMICALLY SEARCH for the file so we don't have to guess the folder path
          echo "🔍 Dynamically searching for ReanimatedVersion.cpp..."
          REANIMATED_VERSION_FILE=$(find node_modules/react-native-reanimated -name "ReanimatedVersion.cpp" -type f | head -n 1)

          if [ -n "$REANIMATED_VERSION_FILE" ]; then
            echo "✅ Found file at: $REANIMATED_VERSION_FILE"
            echo "🔧 Patching for Xcode 16 compatibility..."
            
            if ! grep -q "#define REANIMATED_VERSION_STRING" "$REANIMATED_VERSION_FILE"; then
              # Create a temporary file with the missing defines
              echo '#ifndef REANIMATED_VERSION_STRING' > /tmp/reanimated_patch.h
              echo '#define REANIMATED_VERSION_STRING "3.19.5"' >> /tmp/reanimated_patch.h
              echo '#endif' >> /tmp/reanimated_patch.h
              
              # Append the original file content to the temp file
              cat "$REANIMATED_VERSION_FILE" >> /tmp/reanimated_patch.h
              
              # Overwrite the original file safely
              mv /tmp/reanimated_patch.h "$REANIMATED_VERSION_FILE"
              echo "✅ Applied REANIMATED_VERSION_STRING patch"
            else
              echo "ℹ️ REANIMATED_VERSION_STRING already present, skipping patch."
            fi
            
            # Verify the patch was applied
            if grep -q "REANIMATED_VERSION_STRING" "$REANIMATED_VERSION_FILE"; then
              echo "✅ ReanimatedVersion.cpp patch verification passed"
            else
              echo "❌ ERROR: ReanimatedVersion.cpp patch verification failed"
              exit 1
            fi
          else
            echo "❌ ERROR: ReanimatedVersion.cpp not found anywhere in react-native-reanimated."
            exit 1
          fi

          # Final verification for Hermes
          grep -n '#include <thread>' "$HERMES_EXECUTOR_FILE"

          if ! grep -q '#include <thread>' "$HERMES_EXECUTOR_FILE"; then
            echo "ERROR: Hermes <thread> patch was not applied."
            exit 1
          fi

          echo "All C++ compatibility patches applied and verified successfully."


      # ========================================================
      # RUBY
      # ========================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/${{ env.APP_DIR }}


      # ========================================================
      # PATCH IOS DEPENDENCIES
      # ========================================================
      - name: Patch iOS Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import glob

          # ----------------------------------------------------
          # Boost
          # ----------------------------------------------------
          old_url = (
              "https://boostorg.jfrog.io/artifactory/main/"
              "release/1.76.0/source/boost_1_76_0.tar.bz2"
          )

          new_url = (
              "https://archives.boost.io/release/1.76.0/"
              "source/boost_1_76_0.tar.bz2"
          )

          for path in glob.glob(
              "node_modules/**/boost*.podspec",
              recursive=True
          ):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if old_url in content:
                  content = content.replace(old_url, new_url)

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(f"Patched Boost: {path}")


          # ----------------------------------------------------
          # RCT-Folly
          # ----------------------------------------------------
          for path in glob.glob(
              "node_modules/**/RCT-Folly.podspec",
              recursive=True
          ):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "-Wno-error=unqualified-std-cast-call" not in content:
                  content = content.replace(
                      "folly_compiler_flags = [",
                      (
                          'folly_compiler_flags = ['
                          '"-Wno-error=unqualified-std-cast-call", '
                          '"-Wno-error=c++11-narrowing", '
                          '"-DFOLLY_NO_CONFIG=1", '
                      ),
                      1
                  )

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(f"Patched RCT-Folly: {path}")
          PY


      # ========================================================
      # PODFILE
      # ========================================================
      - name: Install CocoaPods
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail

          bundle exec pod cache clean boost --all || true
          bundle exec pod cache clean RCT-Folly --all || true

          bundle exec pod install --repo-update

          echo "Verifying Pods project C++ configuration..."
          if [ ! -f Pods/Pods.xcodeproj/project.pbxproj ]; then
            echo "ERROR: Pods project was not generated."
            exit 1
          fi

          grep -q "CLANG_CXX_LANGUAGE_STANDARD = c++20" Pods/Pods.xcodeproj/project.pbxproj || echo "WARNING: C++20 setting was not serialized as a literal value; inspect Xcode build settings if needed."

          echo "CocoaPods installation completed."

      # ➕ ADD THIS NEW STEP RIGHT HERE
      - name: Fix QBImagePicker Xcode 16 Signing
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail

          gem install xcodeproj --no-document > /dev/null 2>&1 || true

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'Pods/Pods.xcodeproj'
          if File.exist?(project_path)
            project = Xcodeproj::Project.open(project_path)
            
            target = project.targets.find { |t| t.name == 'RNImageCropPicker-QBImagePicker' }
            
            if target
              target.build_configurations.each do |config|
                # Aggressively disable ALL code signing for this resource bundle
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
              project.save
              puts "✅ Disabled ALL code signing for RNImageCropPicker-QBImagePicker to fix Xcode 16 storyboard compilation."
            else
              puts "ℹ️ RNImageCropPicker-QBImagePicker target not found, skipping."
            end
          end
          RUBY

      # ========================================================
      # APPLE SIGNING CERTIFICATES
      # ========================================================
      - name: Import Apple Development Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.APP_SECRETS_IOS_P12_BASE64 }}
          p12-password: ${{ env.APP_SECRETS_IOS_P12_PASSWORD }}

      # ========================================================
      # VERIFY SIGNING IDENTITIES
      # ========================================================
      - name: Verify iOS Signing Certificates
        shell: bash
        run: |
          set -euo pipefail

          echo "Available code signing identities:"
          security find-identity -v -p codesigning || true

          if ! security find-identity -v -p codesigning | grep -q "Apple Development"; then
            echo "ERROR: Apple Development certificate was not found."
            exit 1
          fi

          echo "Apple Development certificate is installed."

      # ========================================================
      # APP STORE CONNECT API KEY
      # ========================================================
      - name: Prepare App Store Connect API Key for Xcode
        shell: bash
        run: |
          set -euo pipefail

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}.p8"

          if printf '%s' "$APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY" | grep -q -- 'BEGIN PRIVATE KEY'; then
            printf '%s' "$APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          else
            printf '%s' "$APP_SECRETS_IOS_APPSTORE_API_PRIVATE_KEY" | tr -d '\r\n' | base64 --decode > "$API_KEY_PATH"
          fi

          chmod 600 "$API_KEY_PATH"

          if ! grep -q -- 'BEGIN PRIVATE KEY' "$API_KEY_PATH"; then
            echo "ERROR: App Store Connect API key is not a valid PEM private key."
            exit 1
          fi

          echo "XCODE_AUTH_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "App Store Connect API key prepared."

      # ========================================================
      # VERSION
      # ========================================================
      - name: Set iOS Version and Build Number
        working-directory: apps/${{ env.APP_DIR }}/ios
        shell: bash
        run: |
          set -euo pipefail

          xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER"

          if [ -n "${{ inputs.version_name }}" ]; then
            xcrun agvtool new-marketing-version "${{ inputs.version_name }}"
          fi

      # ========================================================
      # RESOLVE WORKSPACE
      # ========================================================
      - name: Resolve Xcode Workspace and Scheme
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${APP_SECRETS_IOS_WORKSPACE:-}" ]; then
            WORKSPACE_PATH="$APP_SECRETS_IOS_WORKSPACE"
          else
            WORKSPACE_PATH="$(
              find ios \
                -maxdepth 1 \
                -name "*.xcworkspace" \
                -type d \
                -print -quit
            )"
          fi

          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERROR: No .xcworkspace found."
            exit 1
          fi

          if [ -n "${APP_SECRETS_IOS_SCHEME:-}" ]; then
            SCHEME_NAME="$APP_SECRETS_IOS_SCHEME"
          else
            SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          fi

          echo "WORKSPACE_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"
          echo "SCHEME_NAME=$SCHEME_NAME" >> "$GITHUB_ENV"

          echo "Workspace: $WORKSPACE_PATH"
          echo "Scheme: $SCHEME_NAME"

      # ========================================================
      # ARCHIVE PREPARATION
      # ========================================================
      - name: Prepare iOS Archive
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ios/build

          echo "Preserving ios/build so React Native Codegen sources remain available."
          echo "Using Xcode automatic signing from the project settings."
          echo "Development Team: ${APP_SECRETS_IOS_TEAM_ID}"
          echo "Bundle ID: ${APP_SECRETS_IOS_BUNDLE_ID}"

      # ========================================================
      # FIX PROJECT SIGNING SETTINGS
      # ========================================================
      - name: Normalize Xcode Development Signing
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = Dir.glob('ios/*.xcodeproj').first
          abort('ERROR: No .xcodeproj found inside ios/.') unless project_path

          project = Xcodeproj::Project.open(project_path)

          target_name = ENV['APP_SECRETS_IOS_TARGET_NAME']
          application_targets = project.targets.select do |t|
            t.respond_to?(:product_type) &&
              t.product_type == 'com.apple.product-type.application'
          end

          target =
            if target_name && !target_name.empty?
              application_targets.find { |t| t.name == target_name }
            elsif ENV['SCHEME_NAME'] && !ENV['SCHEME_NAME'].empty?
              application_targets.find { |t| t.name == ENV['SCHEME_NAME'] }
            elsif application_targets.length == 1
              application_targets.first
            end

          abort(
            'ERROR: Could not resolve the iOS application target. ' +
            'Set APP_SECRETS_IOS_TARGET_NAME in the app secret when the scheme name differs from the target name.'
          ) unless target

          attrs = project.root_object.attributes['TargetAttributes'] ||= {}
          target_attrs = attrs[target.uuid] ||= {}
          target_attrs['ProvisioningStyle'] = 'Automatic'

          target.build_configurations.each do |config|
            config.build_settings.delete('PROVISIONING_PROFILE')
            config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')

            config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APP_SECRETS_IOS_TEAM_ID')
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Development'
          end

          project.save

          puts 'Xcode signing normalized for development.'
          puts "Target: #{target.name}"
          puts 'ProvisioningStyle: Automatic'
          puts 'PROVISIONING_PROFILE: removed'
          puts 'PROVISIONING_PROFILE_SPECIFIER: removed'
          puts 'CODE_SIGN_STYLE: Automatic'
          puts 'CODE_SIGN_IDENTITY: Apple Development'
          RUBY

          echo "Verifying project file no longer contains stale profile settings..."
          PROJECT_PBXPROJ="$(find ios -maxdepth 2 -path '*.xcodeproj/project.pbxproj' -type f -print -quit)"

          if [ -z "$PROJECT_PBXPROJ" ]; then
            echo "ERROR: Could not locate project.pbxproj."
            exit 1
          fi

          if grep -nE 'PROVISIONING_PROFILE(_SPECIFIER)?[[:space:]]*=' "$PROJECT_PBXPROJ"; then
            echo "ERROR: Stale provisioning profile setting remains in project.pbxproj."
            exit 1
          fi

          echo "Development signing project configuration is clean."

      # ========================================================
      # SHOW FINAL XCODE SIGNING SETTINGS
      # ========================================================
      - name: Show Xcode Signing Settings
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "XCODE SIGNING SETTINGS"
          echo "================================================"

          xcodebuild \
            -workspace "${WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -showBuildSettings \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER' \
            || true

      # ========================================================
      # DEVELOPMENT ARCHIVE
      # ========================================================
      - name: Clean iOS Derived Data
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*
          mkdir -p ios/build
          echo "Clean iOS DerivedData state prepared; preserving ios/build Codegen output."

      - name: Build and Archive (Development)
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Using workspace: ${WORKSPACE_PATH}"
          echo "Using scheme: ${SCHEME_NAME}"
          echo "Signing identity: Apple Development"
          echo "Development team: ${APP_SECRETS_IOS_TEAM_ID}"
          echo "Bundle ID: ${APP_SECRETS_IOS_BUNDLE_ID}"

          xcodebuild \
            -workspace "${WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/ios/build/${APP_NAME}.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="${APP_SECRETS_IOS_TEAM_ID}" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "${XCODE_AUTH_KEY_PATH}" \
            -authenticationKeyID "${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_SECRETS_IOS_APPSTORE_ISSUER_ID}" \
            archive
      # ========================================================
      # VERIFY ARCHIVE
      # ========================================================
      - name: Verify iOS Archive
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$PWD/ios/build/${APP_NAME}.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive was not created: $ARCHIVE"
            exit 1
          fi

          echo "Archive created successfully:"
          echo "$ARCHIVE"

      # ========================================================
      # EXPORT OPTIONS
      # ========================================================
      - name: Create ExportOptions.plist
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat > ios/build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APP_SECRETS_IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ios/build/ExportOptions.plist
          echo "ExportOptions.plist created successfully."

      # ========================================================
      # EXPORT IPA
      # ========================================================
      - name: Export IPA
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ios/build/export
          mkdir -p ios/build/export

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/ios/build/${APP_NAME}.xcarchive" \
            -exportPath "$PWD/ios/build/export" \
            -exportOptionsPlist "$PWD/ios/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${XCODE_AUTH_KEY_PATH}" \
            -authenticationKeyID "${APP_SECRETS_IOS_APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_SECRETS_IOS_APPSTORE_ISSUER_ID}"

      # ========================================================
      # PREPARE IPA
      # ========================================================
      - name: Prepare IPA
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          IPA="$(find ios/build/export -name "*.ipa" -type f -print -quit)"

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          OUTPUT="ios/build/${APP_NAME}-${GITHUB_RUN_NUMBER}.ipa"
          cp "$IPA" "$OUTPUT"

          echo "IPA ready:"
          echo "$OUTPUT"

      # ========================================================
      # GITHUB ARTIFACT
      # ========================================================
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-${{ github.run_number }}
          path: apps/${{ env.APP_DIR }}/ios/build/${{ matrix.app }}-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14

      # ========================================================
      # S3
      # ========================================================
      - name: Upload Current iOS IPA to S3
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            "ios/build/${APP_NAME}-${GITHUB_RUN_NUMBER}.ipa" \
            "s3://${S3_BUCKET}/ios/${APP_NAME}/${APP_NAME}.ipa" \
            --only-show-errors


  # ============================================================
  # ANDROID
  # ============================================================
  build-android:
    name: Android - ${{ matrix.app }}

    needs: setup

    if: >
      inputs.platform == 'all' ||
      inputs.platform == 'android'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}

    env:
      APP_NAME: ${{ matrix.app }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ========================================================
      # RESOLVE APP DIRECTORY
      # ========================================================
      - name: Resolve App Directory
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(
            find apps \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -iname "${{ matrix.app }}" \
              -print -quit \
            | sed 's|^apps/||'
          )"

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not find apps/${{ matrix.app }}"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # ========================================================
      # AWS OIDC
      # ========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-mobile-${{ github.run_id }}-${{ matrix.app }}

      # ========================================================
      # VERIFY AWS
      # ========================================================
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "ERROR: S3_BUCKET is empty."
            exit 1
          fi

      # ========================================================
      # LOAD APP SECRETS
      # ========================================================
      - name: Get App Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            APP_SECRETS,app/${{ matrix.app }}/cred
          parse-json-secrets: true

      # ========================================================
      # VALIDATE ANDROID
      # ========================================================
      - name: Validate Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            APP_SECRETS_ANDROID_KEYSTORE_BASE64
            APP_SECRETS_ANDROID_KEYSTORE_PASSWORD
            APP_SECRETS_ANDROID_KEY_ALIAS
            APP_SECRETS_ANDROID_KEY_PASSWORD
            APP_SECRETS_ANDROID_APPLICATION_ID
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Missing required Android variable: $var"
              exit 1
            fi
          done

          echo "Android configuration is present."
          echo "Application ID: $APP_SECRETS_ANDROID_APPLICATION_ID"

      # ========================================================
      # NODE
      # ========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ env.APP_DIR }}/package-lock.json

      # ========================================================
      # NPM
      # ========================================================
      - name: Install Dependencies
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm ci --legacy-peer-deps

      # ========================================================
      # JAVA
      # ========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ========================================================
      # ANDROID KEYSTORE
      # ========================================================
      - name: Create Android Keystore
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          printf '%s' "$APP_SECRETS_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "ERROR: Android keystore is empty."
            exit 1
          fi

      # ========================================================
      # ANDROID SIGNING
      # ========================================================
      - name: Configure Android Signing
        working-directory: apps/${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=${APP_SECRETS_ANDROID_KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_ALIAS=${APP_SECRETS_ANDROID_KEY_ALIAS}
          MYAPP_UPLOAD_KEY_PASSWORD=${APP_SECRETS_ANDROID_KEY_PASSWORD}
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          EOF

      # ========================================================
      # ANDROID BUILD
      # ========================================================
      - name: Build Android AAB
        working-directory: apps/${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew bundleRelease \
            --no-daemon \
            -x bundleReleaseGplay \
            -x bundleReleaseAmazon
